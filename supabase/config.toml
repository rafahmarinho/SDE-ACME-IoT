# Supabase CLI configuration: used by the local stack (`supabase start`) and applied to the hosted
# project with `supabase config push`. Only security-relevant settings are listed; everything else
# keeps the CLI defaults. Set SUPABASE_AUTH_SITE_URL to the deployed web URL before pushing.
project_id = "acme-iot"

[api]
# SDE T2600: PostgREST never returns more than this many rows per request.
max_rows = 1000

[auth]
enabled = true
site_url = "env(SUPABASE_AUTH_SITE_URL)"
additional_redirect_urls = ["http://localhost:8081/reset-password"]
# Access tokens live one hour; refresh tokens rotate and cannot be replayed.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Members are invited by their organization; there is no self-registration.
enable_signup = false
enable_anonymous_sign_ins = false
# SDE T143: minimum password standard (same rule as passwordPolicyViolations in the app).
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
# SDE T70, T2: sign-in, verification and token limits apply per IP address; email_sent is the hourly
# cap for the whole project (custom SMTP), shared by invitations, recovery and e-mail changes.
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150

[auth.email]
enable_signup = false
enable_confirmations = true
# SDE T742: a new e-mail address is confirmed from both the old and the new mailbox.
double_confirm_changes = true
# SDE T2: changing the password requires a recent sign-in or the recovery link.
secure_password_change = true
# SDE T2: recovery links are single use and expire after one hour; one e-mail per minute per user.
otp_expiry = 3600
max_frequency = "60s"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Adds org_id and user_role to access tokens (public.custom_access_token_hook, 20261019 migration).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"
