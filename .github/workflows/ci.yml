name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Installs exactly what pnpm-lock.yaml pins (integrity hashes are verified).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Functional tests
        run: pnpm test

      # The security checks below verify that every inline script of this export is allowed by the CSP.
      - name: Build web export
        run: pnpm build:web
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Security controls
        run: pnpm test:security

      - name: Dependency audit (production dependencies)
        run: pnpm audit --prod --audit-level high
